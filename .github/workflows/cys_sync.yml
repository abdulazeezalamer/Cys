name: Cys Tactical Engine Sync

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Kaggle CLI
        run: |
          pip install kaggle

      - name: Authenticate Kaggle & Run Engine
        run: |
          mkdir -p ~/.kaggle
          echo '{"username":"abdulazeezalamer","key":"${{ secrets.KAGGLE_KEY }}"}' > ~/.kaggle/kaggle.json
          chmod 600 ~/.kaggle/kaggle.json

          # رفع الكود وتحديث وتشغيل النوت بوك على كاجل مع كرت الشاشة
          kaggle kernels push -p .

          # انتظار قصير حتى تبدأ المهمة على كاجل
          sleep 15

          # محاولة سحب ملف الحالة والنتائج (system_status.json) إن وجد
          kaggle kernels pull abdulazeezalamer/cys-tactical-core -p . --metadata || true

      - name: Commit and Push Results Back to GitHub
        run: |
          git config --global user.name "Cys-Bot"
          git config --global user.email "bot@cys.system"
          git add system_status.json || true
          git commit -m "Auto-sync: Cys tactical engine execution report [skip ci]" || true
          git push || true
