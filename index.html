<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Cys">
    <title>Cyber Yas System | Cys</title>
    <style>
        :root {
            --bg-dark: #0a0e14;
            --panel-bg: #11161f;
            --border-color: #1e293b;
            --accent-green: #10b981;
            --accent-amber: #f59e0b;
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
            --danger: #ef4444;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }

        header { background-color: var(--panel-bg); border-bottom: 1px solid var(--border-color); padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; }
        .brand { display: flex; align-items: center; gap: 10px; }
        .status-dot { width: 10px; height: 10px; background-color: var(--accent-amber); border-radius: 50%; box-shadow: 0 0 8px var(--accent-amber); }
        .status-dot.ok { background-color: var(--accent-green); box-shadow: 0 0 8px var(--accent-green); }
        .status-dot.err { background-color: var(--danger); box-shadow: 0 0 8px var(--danger); }
        .brand h1 { font-size: 16px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; }
        .brand span { color: var(--accent-green); font-family: monospace; }
        .badge { font-size: 11px; background: rgba(16, 185, 129, 0.15); color: var(--accent-green); padding: 4px 8px; border-radius: 4px; border: 1px solid rgba(16, 185, 129, 0.3); font-family: monospace; }

        #chat-box { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
        .message { max-width: 85%; padding: 12px 14px; border-radius: 10px; font-size: 14px; line-height: 1.6; position: relative; white-space: pre-wrap; word-wrap: break-word; }
        .msg-user { background-color: #1e293b; align-self: flex-start; border-bottom-right-radius: 2px; }
        .msg-ai { background-color: var(--panel-bg); border: 1px solid var(--border-color); align-self: flex-end; border-bottom-left-radius: 2px; }
        .msg-header { font-size: 11px; color: var(--accent-green); margin-bottom: 4px; font-family: monospace; }
        .msg-ai.thinking { color: var(--text-muted); }

        .feedback-actions { display: flex; gap: 8px; margin-top: 10px; padding-top: 8px; border-top: 1px solid rgba(255,255,255,0.06); }
        .btn-fb { background: transparent; border: 1px solid var(--border-color); color: var(--text-muted); padding: 4px 10px; border-radius: 6px; font-size: 12px; cursor: pointer; transition: all 0.2s; }
        .btn-fb:disabled { cursor: default; opacity: 0.6; }
        .btn-fb.ok:hover, .btn-fb.ok.active { border-color: var(--accent-green); color: var(--accent-green); background: rgba(16, 185, 129, 0.1); }
        .btn-fb.bad:hover, .btn-fb.bad.active { border-color: var(--danger); color: var(--danger); background: rgba(239, 68, 68, 0.1); }

        .input-container { background-color: var(--panel-bg); border-top: 1px solid var(--border-color); padding: 12px; display: flex; gap: 8px; padding-bottom: calc(12px + env(safe-area-inset-bottom)); }
        input[type="text"] { flex: 1; background-color: var(--bg-dark); border: 1px solid var(--border-color); color: var(--text-main); padding: 12px; border-radius: 8px; font-size: 16px; outline: none; }
        input[type="text"]:focus { border-color: var(--accent-green); }
        button#send-btn { background-color: var(--accent-green); color: #052e16; border: none; padding: 0 18px; border-radius: 8px; font-weight: 700; font-size: 14px; cursor: pointer; }
        button#send-btn:disabled { opacity: 0.4; }
        button#send-btn:active { opacity: 0.8; }

        .footer { display: flex; justify-content: space-between; align-items: center; padding: 6px 14px; font-size: 11px; color: var(--text-muted); font-family: monospace; background: var(--panel-bg); border-top: 1px solid var(--border-color); }
        .footer button { background: none; border: 1px solid var(--border-color); color: var(--accent-amber); padding: 3px 10px; border-radius: 4px; font-size: 11px; cursor: pointer; font-family: monospace; }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <div class="status-dot" id="status-dot"></div>
            <h1>Cyber Yas <span>[Cys]</span></h1>
        </div>
        <div class="badge" id="status-text">LOADING</div>
    </header>

    <div id="chat-box"></div>

    <div class="input-container">
        <input type="text" id="user-input" placeholder="أدخل الأمر أو الاستفسار هنا..." dir="auto">
        <button id="send-btn" disabled>إرسال</button>
    </div>

    <div class="footer">
        <span>التصحيحات: <span id="count">0</span></span>
        <button id="export-btn">تصدير JSON</button>
    </div>

    <script type="module">
        const MODEL_ID = "onnx-community/gemma-3-1b-it-ONNX";
        const HISTORY_KEY = "cys_chat_history_v1";
        const FEEDBACK_KEY = "cys_corrections_v1";
        const SYSTEM_NAME = "CYS-CORE";
        const SYSTEM_PROMPT = "أنت CYS-CORE، مساعد لتحليل البيانات والإجابة من الكراسات. أجب بالعربية الفصحى.";

        const chatBox = document.getElementById("chat-box");
        const userInput = document.getElementById("user-input");
        const sendBtn = document.getElementById("send-btn");
        const statusDot = document.getElementById("status-dot");
        const statusText = document.getElementById("status-text");
        const countEl = document.getElementById("count");
        const exportBtn = document.getElementById("export-btn");

        let generator = null;
        let messages = [];       // {role, content, id}
        const llmHistory = [];   // للنموذج فقط

        function loadJSON(key, fallback) {
            try { return JSON.parse(localStorage.getItem(key)) ?? fallback; }
            catch { return fallback; }
        }

        function setStatus(text, state = "") {
            statusText.textContent = text;
            statusDot.className = "status-dot " + state;
        }

        function corrections() { return loadJSON(FEEDBACK_KEY, []); }
        function refreshCount() { countEl.textContent = corrections().length; }

        function saveChat() {
            localStorage.setItem(HISTORY_KEY, JSON.stringify(messages));
        }

        function renderMessage(msg) {
            const div = document.createElement("div");
            if (msg.role === "user") {
                div.className = "message msg-user";
                div.textContent = msg.content;
                chatBox.appendChild(div);
                return div;
            }
            div.className = "message msg-ai" + (msg.pending ? " thinking" : "");
            const header = document.createElement("div");
            header.className = "msg-header";
            header.textContent = "SYSTEM // " + SYSTEM_NAME;
            const body = document.createElement("div");
            body.textContent = msg.content;
            div.append(header, body);
            if (!msg.pending) addFeedback(div, msg);
            chatBox.appendChild(div);
            return div;
        }

        function addFeedback(div, msg) {
            const wrap = document.createElement("div");
            wrap.className = "feedback-actions";
            const ok = document.createElement("button");
            ok.className = "btn-fb ok"; ok.textContent = "✓ صحيح";
            const bad = document.createElement("button");
            bad.className = "btn-fb bad"; bad.textContent = "✕ خطأ";
            wrap.append(ok, bad);
            div.appendChild(wrap);

            const lockIn = (btn) => {
                wrap.querySelectorAll(".btn-fb").forEach(b => { b.disabled = true; b.classList.remove("active"); });
                btn.classList.add("active");
                btn.disabled = false;
                refreshCount();
            };

            ok.onclick = () => {
                const list = corrections();
                list.push({ time: new Date().toISOString(), question: msg.question, answer: msg.content, verdict: "correct" });
                localStorage.setItem(FEEDBACK_KEY, JSON.stringify(list));
                lockIn(ok);
            };
            bad.onclick = () => {
                const fix = (prompt("اكتب الإجابة الصحيحة (اختياري):") ?? "").trim();
                const list = corrections();
                list.push({ time: new Date().toISOString(), question: msg.question, answer: msg.content, verdict: "wrong", correction: fix });
                localStorage.setItem(FEEDBACK_KEY, JSON.stringify(list));
                lockIn(bad);
            };
        }

        function restoreChat() {
            messages = loadJSON(HISTORY_KEY, []).filter(m => !m.pending);
            if (messages.length === 0) {
                messages.push({ role: "assistant", content: "النظام جاهز للعمل. بانتظار الأوامر أو البيانات التكتيكية.", question: "" });
            }
            chatBox.innerHTML = "";
            messages.forEach(renderMessage);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        async function loadModel() {
            try {
                setStatus("LOADING", "");
                statusText.textContent = "LOADING";
                const { pipeline, env } = await import("https://cdn.jsdelivr.net/npm/@huggingface/transformers@3");
                env.allowLocalModels = false;
                const opts = { dtype: "q4" };
                generator = await pipeline("text-generation", MODEL_ID, {
                    ...opts,
                    device: "webgpu",
                    progress_callback: (p) => {
                        if (p.status === "progress" && p.progress) statusText.textContent = Math.round(p.progress) + "%";
                    },
                }).catch(() => pipeline("text-generation", MODEL_ID, opts));
                setStatus("ONLINE", "ok");
                statusText.textContent = "ONLINE";
            } catch (e) {
                console.error(e);
                setStatus("OFFLINE", "err");
                statusText.textContent = "OFFLINE";
            }
            sendBtn.disabled = false;
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text || sendBtn.disabled) return;
            userInput.value = "";
            sendBtn.disabled = true;

            messages.push({ role: "user", content: text });
            renderMessage(messages.at(-1));

            const pending = { role: "assistant", content: "...", pending: true, question: text };
            const pendingEl = renderMessage(pending);
            chatBox.scrollTop = chatBox.scrollHeight;

            let answer;
            if (!generator) {
                answer = "النموذج غير متصل حالياً. تأكد من الإنترنت ثم أعد تحميل الصفحة.";
            } else {
                llmHistory.push({ role: "user", content: text });
                try {
                    const out = await generator(
                        [{ role: "system", content: SYSTEM_PROMPT }, ...llmHistory],
                        { max_new_tokens: 300, do_sample: false }
                    );
                    answer = out[0].generated_text.at(-1).content;
                    llmHistory.push({ role: "assistant", content: answer });
                } catch (e) {
                    console.error(e);
                    answer = "حدث خطأ أثناء التوليد.";
                }
            }

            pendingEl.remove();
            const finalMsg = { role: "assistant", content: answer, question: text };
            messages.push(finalMsg);
            renderMessage(finalMsg);
            saveChat();
            chatBox.scrollTop = chatBox.scrollHeight;
            sendBtn.disabled = false;
            userInput.focus();
        }

        sendBtn.onclick = sendMessage;
        userInput.addEventListener("keydown", (e) => { if (e.key === "Enter") sendMessage(); });

        exportBtn.onclick = () => {
            const blob = new Blob([JSON.stringify(corrections(), null, 2)], { type: "application/json" });
            const a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = "cys_corrections_v1.json";
            a.click();
        };

        restoreChat();
        refreshCount();
        loadModel();
    </script>
</body>
</html>
