<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Cys">
    <title>Cyber Yas System | Cys</title>
    <style>
        :root {
            --bg-dark: #0a0e14;
            --panel-bg: #11161f;
            --border-color: #1e293b;
            --accent-green: #10b981;
            --accent-amber: #f59e0b;
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
            --danger: #ef4444;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }

        header { background-color: var(--panel-bg); border-bottom: 1px solid var(--border-color); padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; }
        .brand { display: flex; align-items: center; gap: 10px; }
        .status-dot { width: 10px; height: 10px; background-color: var(--accent-amber); border-radius: 50%; box-shadow: 0 0 8px var(--accent-amber); }
        .status-dot.ok { background-color: var(--accent-green); box-shadow: 0 0 8px var(--accent-green); }
        .brand h1 { font-size: 16px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; }
        .brand span { color: var(--accent-green); font-family: monospace; }
        .badge { font-size: 11px; background: rgba(16, 185, 129, 0.15); color: var(--accent-green); padding: 4px 8px; border-radius: 4px; border: 1px solid rgba(16, 185, 129, 0.3); font-family: monospace; }

        /* شريط المحرار التكتيكي */
        #diagnostic-bar { background-color: #0d131f; border-bottom: 1px solid var(--border-color); padding: 8px 16px; font-size: 12px; font-family: monospace; color: var(--accent-amber); }

        #chat-box { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
        .message { max-width: 85%; padding: 12px 14px; border-radius: 10px; font-size: 14px; line-height: 1.6; position: relative; white-space: pre-wrap; word-wrap: break-word; }
        .msg-user { background-color: #1e293b; align-self: flex-start; border-bottom-right-radius: 2px; }
        .msg-ai { background-color: var(--panel-bg); border: 1px solid var(--border-color); align-self: flex-end; border-bottom-left-radius: 2px; }
        .msg-header { font-size: 11px; color: var(--accent-green); margin-bottom: 4px; font-family: monospace; }

        .input-container { background-color: var(--panel-bg); border-top: 1px solid var(--border-color); padding: 12px; display: flex; gap: 8px; padding-bottom: calc(12px + env(safe-area-inset-bottom)); }
        input[type="text"] { flex: 1; background-color: var(--bg-dark); border: 1px solid var(--border-color); color: var(--text-main); padding: 12px; border-radius: 8px; font-size: 16px; outline: none; }
        input[type="text"]:focus { border-color: var(--accent-green); }
        button#send-btn { background-color: var(--accent-green); color: #052e16; border: none; padding: 0 18px; border-radius: 8px; font-weight: 700; font-size: 14px; cursor: pointer; }
        button#send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        .footer { display: flex; justify-content: space-between; align-items: center; padding: 6px 14px; font-size: 11px; color: var(--text-muted); font-family: monospace; background: var(--panel-bg); border-top: 1px solid var(--border-color); }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <div class="status-dot" id="status-dot"></div>
            <h1>Cyber Yas <span>[Cys]</span></h1>
        </div>
        <div class="badge" id="status-badge">CHECKING</div>
    </header>

    <!-- محرار النظام التكتيكي -->
    <div id="diagnostic-bar">[*] جاري فحص الاتصال وقراءة حالة العقل السحابي...</div>

    <div id="chat-box"></div>

    <div class="input-container">
        <input type="text" id="user-input" placeholder="أدخل الأمر التكتيكي هنا..." dir="auto">
        <button id="send-btn" disabled>إرسال</button>
    </div>

    <div class="footer">
        <span>العمارة: GitHub + Kaggle GPU</span>
        <span>الحالة: متصل</span>
    </div>

    <script>
        const chatBox = document.getElementById("chat-box");
        const userInput = document.getElementById("user-input");
        const sendBtn = document.getElementById("send-btn");
        const diagnosticBar = document.getElementById("diagnostic-bar");
        const statusDot = document.getElementById("status-dot");
        const statusBadge = document.getElementById("status-badge");

        let messages = [];

        function renderMessages() {
            chatBox.innerHTML = "";
            messages.forEach(msg => {
                const div = document.createElement("div");
                if (msg.role === "user") {
                    div.className = "message msg-user";
                    div.textContent = msg.content;
                } else {
                    div.className = "message msg-ai";
                    div.innerHTML = `<div class="msg-header">SYSTEM // CYS-CORE</div><div>${msg.content}</div>`;
                }
                chatBox.appendChild(div);
            });
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // فحص حالة النظام وقراءة ملف system_status.json من جيثوب
        async function checkSystemStatus() {
            try {
                diagnosticBar.textContent = "[*] جاري فحص ملفات الحالة والتشفير على جيثوب...";
                const res = await fetch('./system_status.json?t=' + Date.now());

                if (res.ok) {
                    const data = await res.json();
                    if (data.status === "READY") {
                        diagnosticBar.textContent = "[✓] " + data.message;
                        diagnosticBar.style.color = "var(--accent-green)";
                        statusDot.className = "status-dot ok";
                        statusBadge.textContent = "ONLINE";
                        sendBtn.disabled = false; // تفعيل زر الإرسال

                        // إذا وجد رد من العقل السحابي، اعرضه
                        if (data.engine_response && !messages.some(m => m.content === data.engine_response)) {
                            messages.push({ role: "assistant", content: data.engine_response });
                            renderMessages();
                        } else if (messages.length === 0) {
                            messages.push({ role: "assistant", content: "النظام العسكري سايبرياس (Cys) جاهز لتلقي الأوامر والتوجيهات الميدانية." });
                            renderMessages();
                        }
                    } else {
                        diagnosticBar.textContent = "[!] النظام قيد التحضير في الكلاود...";
                    }
                } else {
                    diagnosticBar.textContent = "[!] بانتظار توليد ملف الحالة الأول من كاجل...";
                }
            } catch (e) {
                diagnosticBar.textContent = "[!] جارِ الاتصال بالعقل السحابي...";
            }
        }

        function sendMessage() {
            const text = userInput.value.trim();
            if (!text || sendBtn.disabled) return;
            userInput.value = "";

            messages.push({ role: "user", content: text });
            renderMessages();

            messages.push({ role: "assistant", content: "جاري إرسال الأمر وتوجيهه إلى عقل Kaggle العسكري للمعالجة..." });
            renderMessages();

            // ملاحظة: لرفع الأمر إلى جيثوب تلقائياً، يمكنك لاحقاً ربطه بـ API أو إنشاء command.json
        }

        sendBtn.onclick = sendMessage;
        userInput.addEventListener("keydown", (e) => { if (e.key === "Enter") sendMessage(); });

        // فحص أولي ودوري لحالة النظام
        checkSystemStatus();
        setInterval(checkSystemStatus, 8000);
    </script>
</body>
</html>
